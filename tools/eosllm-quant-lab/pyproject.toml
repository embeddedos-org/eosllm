[project]
name = "eosllm-quant-lab"
version = "3.0.0"
description = "Sub-2-bit quant experiments and perplexity scoring for eosllm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "datasets>=2.0.0",
    "tqdm",
]

[project.scripts]
eosllm-quant-lab = "eosllm_quant_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
