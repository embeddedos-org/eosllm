<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>eosllm</title>
<style>
  body { width: 360px; min-height: 320px; margin: 0; padding: 8px;
         font-family: system-ui, sans-serif; font-size: 13px; }
  #log { border: 1px solid #ccc; padding: 6px; height: 240px;
         overflow-y: auto; white-space: pre-wrap;
         font-family: ui-monospace, monospace; font-size: 12px;
         margin-bottom: 6px; }
  #row { display: flex; gap: 4px; }
  #prompt { flex: 1; padding: 4px 6px; }
  button { padding: 4px 10px; cursor: pointer; }
  .meta { color: #888; font-style: italic; margin-top: 4px; }
  .user { color: #06c; margin-top: 6px; }
  a { color: inherit; font-size: 11px; }
</style>
</head>
<body>
  <div id="log"></div>
  <div id="row">
    <input id="prompt" type="text" placeholder="Ask anything…" />
    <button id="send">Send</button>
  </div>
  <div style="margin-top:6px; text-align:right;">
    <a href="#" id="open-options">settings</a>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
