name: release

# Triggers on a v* tag push (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the library + tools, runs the full PR-gating chain plus
# nightly chain, packages a source tarball + binary tarball, creates
# a GitHub Release with both as assets.
#
# Inert until a tag is pushed. Manual `workflow_dispatch` is also
# allowed for dry-run testing without tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write          # required to create the GitHub release

jobs:
  release:
    name: build + verify + publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need tags for `git describe`

      - name: Install clang (for sanitize chain)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Resolve version
        id: version
        run: |
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$(git describe --tags --always --dirty)"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: make all-checks
        run: make CC=clang all-checks

      - name: Build release tools
        run: make tools

      - name: Source tarball
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="eosllm-${v}/" \
            -o "dist/eosllm-${v}-src.tar.gz" HEAD
          ls -la dist/

      - name: Binary tarball (linux-x86_64)
        run: |
          v="${{ steps.version.outputs.version }}"
          stage="staging/eosllm-${v}-linux-x86_64"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include" "$stage/share/doc/eosllm"
          cp tools/eosllm-cli/eosllm-cli       "$stage/bin/"
          cp tools/eosllm-bench/eosllm-bench   "$stage/bin/"
          cp tools/eosllm-convert/eosllm-convert "$stage/bin/" || true
          cp libeosllm.a                       "$stage/lib/"
          cp -r include/eosllm                 "$stage/include/"
          cp LICENSE README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md \
             "$stage/share/doc/eosllm/"
          (cd staging && tar czf "../dist/eosllm-${v}-linux-x86_64.tar.gz" \
            "eosllm-${v}-linux-x86_64")
          ls -la dist/

      - name: Compute artifact checksums
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: eosllm ${{ steps.version.outputs.version }}
          body: |
            See [CHANGELOG.md](https://github.com/embeddedos-org/eosllm/blob/v${{ steps.version.outputs.version }}/CHANGELOG.md) for the full notes.

            **Verification**

            ```
            sha256sum --check SHA256SUMS
            ```

            **Reproducible build**

            From the source tarball:

            ```
            tar xzf eosllm-${{ steps.version.outputs.version }}-src.tar.gz
            cd eosllm-${{ steps.version.outputs.version }}
            make test               # 156/156 should pass on AVX2 x86_64
            make all-checks         # full ~5 min health gate
            ```
          files: |
            dist/eosllm-${{ steps.version.outputs.version }}-src.tar.gz
            dist/eosllm-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
