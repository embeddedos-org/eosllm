name: CI — eosllm

# C99 core built with the Makefile + self-contained Python test wrappers
# (stdlib only). Releases are owned by release.yml, which builds signed
# 4-platform binaries on v* tags — this workflow only tests.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Test Matrix ───────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-22.04, macos-13, windows-2022]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Windows has no native `cc`/`make`; use the same MinGW-w64
      # (msys2/mingw64) environment the release build uses.
      - name: Set up MSYS2 toolchain (Windows)
        if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Build C library
        if: matrix.os != 'windows-2022'
        run: make

      - name: Build C library (Windows)
        if: matrix.os == 'windows-2022'
        shell: msys2 {0}
        run: make CC=gcc

      - name: Run C unit tests
        if: matrix.os != 'windows-2022'
        run: make test

      - name: Run C unit tests (Windows)
        if: matrix.os == 'windows-2022'
        shell: msys2 {0}
        run: make test CC=gcc

      - name: Install Python test dependencies
        # The Python tests are stdlib-only wrappers around the C core;
        # only the test runners themselves need installing.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark

      - name: Run Python unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short \
            --cov=. --cov-report=xml --cov-report=term-missing

      - name: Run functional + simulation tests
        run: python -m pytest tests/functional/ tests/simulation/ -v --tb=short

      - name: Run performance benchmarks
        run: python -m pytest tests/performance/ -v --tb=short --benchmark-json=benchmark.json
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: eosllm-py${{ matrix.python-version }}
